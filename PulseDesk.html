<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PulseDesk</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9FAFB;--c:#FFFFFF;--t:#111827;--m:#6B7280;--b:#E5E7EB;--p:#4F46E5;--pl:rgba(79,70,229,.1);--g:#10B981;--a:#F59E0B;--r:#EF4444;--out:#E5E7EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0B0F19;--c:#151B2B;--t:#F3F4F6;--m:#9CA3AF;--b:#252D40;--pl:rgba(129,140,248,.16);--p:#6366F1;--out:#05070C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--out);color:var(--t);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.frame{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:431px){.frame{border-left:1px solid var(--b);border-right:1px solid var(--b)}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--b)}
.top b{font-size:18px;letter-spacing:-.3px}.logo{color:var(--p)}
.pg{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px}
h1{font-size:24px;letter-spacing:-.6px;margin:0}h2{font-size:18px;margin:0 0 10px}.mu{color:var(--m);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{padding:12px}.stats b{font-size:24px;display:block;letter-spacing:-.5px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--c);border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:11px;font-weight:600;color:var(--m);transition:.2s;border-radius:12px}
.nav button.on{color:var(--p)}.nav button.on svg{transform:translateY(-1px) scale(1.1)}.nav svg{transition:.2s}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:active{transform:scale(.96)}
.btn{background:var(--p);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;transition:.15s}.btn.o{background:none;color:var(--t);border:1px solid var(--b)}.btn.d{background:none;color:var(--r);border:1px solid var(--b)}.btn.w{width:100%}.btn.s{padding:8px 12px;font-size:13px}
.tm{background:var(--p);color:#fff;border:0}.tm .mu{color:rgba(255,255,255,.75)}.tm b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tm select{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:9px;width:100%;margin:8px 0}.tm select option{color:#111}
.tm .btn{background:#fff;color:var(--p)}.tm .btn.o{background:rgba(255,255,255,.18);color:#fff;border:0}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
.task{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--b);background:none;flex:none;display:grid;place-items:center;color:#fff;margin-top:1px;transition:.2s}
.done .ck{background:var(--g);border-color:var(--g)}
.tt{font-weight:600;background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 1.5px;transition:background-size .3s,color .3s}.done .tt{background-size:100% 1.5px;color:var(--m)}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;color:#fff}.b-High{background:var(--r)}.b-Medium{background:var(--a)}.b-Low{background:#94A3B8}.b-done{background:var(--g)}.b-doing{background:var(--a)}.b-todo{background:#94A3B8}
.pills{display:flex;gap:8px;overflow-x:auto}.pill{white-space:nowrap;border:1px solid var(--b);background:var(--c);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--m)}.pill.on{background:var(--t);color:var(--bg);border-color:var(--t)}
.in{width:100%;border:1px solid var(--b);border-radius:12px;padding:11px 12px;background:var(--c);outline:0}.in:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}.err{color:var(--r);font-size:13px;margin-top:6px}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;margin-left:calc(min(50vw,215px) - 72px);width:54px;height:54px;border-radius:50%;background:var(--p);color:#fff;border:0;box-shadow:0 6px 18px rgba(79,70,229,.45);display:grid;place-items:center;z-index:6}
.bar{height:7px;background:var(--b);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width .5s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;justify-content:center;align-items:flex-end;animation:f .2s}
.sheet{background:var(--c);width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:u .25s}
.grab{width:40px;height:4px;border-radius:9px;background:var(--b);margin:0 auto 14px}
@keyframes u{from{transform:translateY(100%)}}@keyframes f{from{opacity:0}}
.av{width:76px;height:76px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;margin:0 auto}
.sw{width:46px;height:28px;border-radius:99px;background:var(--b);border:0;position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--p)}.sw.on:after{left:21px}
.auth{padding:56px 24px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--m);padding:28px 0}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="frame" id="app"></div><div id="sh"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),K='pulsedesk.v1';
const td=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({pw:'demo1234',name:'Jordan Lee',title:'Product Designer',rate:85,setup:true,timer:null,
tasks:[{id:'t1',title:'Finalize homepage wireframes',pid:'p1',due:td(0),pri:'High',est:3,st:'doing'},{id:'t2',title:'Send invoice for sprint 2',pid:'p3',due:td(0),pri:'Medium',est:.5,st:'todo'},{id:'t3',title:'Discovery call prep',pid:'p2',due:td(1),pri:'High',est:1.5,st:'todo'},{id:'t4',title:'Audit design system tokens',pid:'p1',due:td(2),pri:'Low',est:2,st:'todo'},{id:'t5',title:'Kickoff workshop deck',pid:'p2',due:td(-2),pri:'Medium',est:4,st:'done'},{id:'t6',title:'Update team handbook',pid:'p3',due:td(-1),pri:'Low',est:1,st:'done'}],
projects:[{id:'p1',name:'Acme Corp Redesign',client:'Acme Corp'},{id:'p2',name:'Northstar Consulting',client:'Northstar'},{id:'p3',name:'Internal Ops',client:'Self'}],
logs:[{id:'l1',tid:'t5',pid:'p2',sec:9000,date:td(-2)},{id:'l2',tid:'t1',pid:'p1',sec:5400,date:td(0)},{id:'l3',tid:'t6',pid:'p3',sec:2700,date:td(-1)},{id:'l4',tid:'t4',pid:'p1',sec:7200,date:td(-3)}]});
let DB={v:1,users:{'demo@pulsedesk.app':seed()},session:null,dark:null};
try{const x=JSON.parse(localStorage.getItem(K));if(x&&x.v===1)DB=x}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const U=()=>DB.users[DB.session];
let V={tab:'dash',f:'All',q:'',mode:'in',err:''};
function theme(){const d=DB.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:DB.dark;document.documentElement.dataset.theme=d?'dark':'light'}
const IC={dash:'<path d="M4 11l8-7 8 7v9H4z"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',proj:'<path d="M3 6h7l2 2h9v11H3z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',ck:'<path d="M5 12l4 4 10-10"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const toast=t=>{$('#tt').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('#tt').innerHTML='',2000)};
const proj=id=>U().projects.find(p=>p.id===id),hrs=pid=>U().logs.filter(l=>!pid||l.pid===pid).reduce((a,l)=>a+l.sec,0)/3600;
const fmt=s=>[s/3600|0,(s%3600)/60|0,s%60].map(n=>String(n).padStart(2,'0')).join(':');
const el=()=>{const t=U().timer;return t?t.acc+(t.start?Date.now()-t.start:0):0};
const fdate=d=>d===td(0)?'Today':d===td(1)?'Tomorrow':new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
/* auth */
function auth(){const si=V.mode==='in';
 $('#app').innerHTML=`<div class="auth"><h1><span class="logo">⚡</span> PulseDesk</h1><p class="mu" style="margin:0 0 18px">Tasks, projects and billable time in one calm place.</p>
 <label>Email</label><input class="in" id="em" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input class="in" id="pw" type="password" placeholder="At least 6 characters">
 <div class="err">${V.err}</div><button class="btn w" style="margin-top:10px" onclick="${si?'login()':'signup()'}">${si?'Log in':'Create account'}</button>
 <button class="btn o w" onclick="demo()">Quick Demo Login</button>
 <p class="mu" style="text-align:center">${si?'New here?':'Have an account?'} <a href="#" style="color:var(--p);font-weight:600" onclick="V.mode='${si?'up':'in'}';V.err='';render();return false">${si?'Sign up':'Log in'}</a></p></div>`}
function cred(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(e)){V.err='Enter a valid email address.';return}if(p.length<6){V.err='Password must be at least 6 characters.';return}return{e,p}}
function login(){const c=cred();if(!c)return render();const u=DB.users[c.e];if(!u||u.pw!==c.p){V.err='Email or password is incorrect.';return render()}start(c.e)}
function signup(){const c=cred();if(!c)return render();if(DB.users[c.e]){V.err='An account with this email already exists.';return render()}DB.users[c.e]={pw:c.p,name:'',title:'',rate:0,setup:false,timer:null,tasks:[],projects:[],logs:[]};start(c.e)}
function demo(){if(!DB.users['demo@pulsedesk.app'])DB.users['demo@pulsedesk.app']=seed();start('demo@pulsedesk.app')}
function start(e){DB.session=e;V={tab:'dash',f:'All',q:'',mode:'in',err:''};save();render()}
function setup(){$('#app').innerHTML=`<div class="auth"><h1>Set up your profile</h1><p class="mu" style="margin:0 0 8px">Your rate is used to calculate billable value.</p>
 <label>Full name</label><input class="in" id="sn" placeholder="Jordan Lee"><label>Business / role title</label><input class="in" id="st" placeholder="Independent Consultant"><label>Hourly billing rate ($)</label><input class="in" id="sr" type="number" min="0" placeholder="85">
 <div class="err">${V.err}</div><button class="btn w" style="margin-top:10px" onclick="doSetup()">Start using PulseDesk</button></div>`}
function doSetup(){const u=U(),n=$('#sn').value.trim(),r=parseFloat($('#sr').value);if(!n||!(r>=0)){V.err='Add your name and an hourly rate.';return setup()}Object.assign(u,{name:n,title:$('#st').value.trim()||'Freelancer',rate:r,setup:true});V.err='';save();render()}
/* main */
function render(){theme();if(!DB.session||!U())return auth();if(!U().setup)return setup();
 const T={dash:'Dashboard',tasks:'Tasks',proj:'Clients & Projects',user:'Profile'};
 $('#app').innerHTML=`<div class="top"><b><span class="logo">⚡</span> ${T[V.tab]}</b><span class="mu">${esc(U().name.split(' ')[0])}</span></div><div class="pg" id="pg">${({dash,tasks,proj:projF,user})[V.tab]()}</div>
 ${V.tab==='tasks'?`<button class="fab" aria-label="New task" onclick="tsheet()">${ic('plus')}</button>`:''}
 <div class="nav">${Object.keys(T).map(k=>`<button class="${V.tab===k?'on':''}" onclick="V.tab='${k}';render();scrollTo(0,0)">${ic(k)}${k==='proj'?'Projects':T[k]}</button>`).join('')}</div>`}
function dash(){const u=U(),h=new Date().getHours(),due=u.tasks.filter(t=>t.st!=='done'&&t.due<=td(0)).length,wk=u.logs.filter(l=>l.date>=td(-6)).reduce((a,l)=>a+l.sec,0)/3600;
 const pr={High:0,Medium:1,Low:2},next=u.tasks.filter(t=>t.st!=='done').sort((a,b)=>(a.due>td(0))-(b.due>td(0))||pr[a.pri]-pr[b.pri]||a.due.localeCompare(b.due)).slice(0,3);
 return `<div><h1>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(u.name.split(' ')[0])}</h1><div class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div>
 <div class="stats"><div class="card"><b>${due}</b><span class="mu">Due today</span></div><div class="card"><b>${u.projects.length}</b><span class="mu">Active projects</span></div><div class="card"><b>${wk.toFixed(1)}</b><span class="mu">Hrs this week</span></div></div>
 ${timer()}<div><h2>Up next</h2><div style="display:flex;flex-direction:column;gap:10px">${next.length?next.map(tc).join(''):'<div class="empty">Nothing pending. Add a task to get started.</div>'}</div></div>`}
function timer(){const t=U().timer;
 if(!t){const o=U().tasks.filter(x=>x.st!=='done').map(x=>`<option value="t:${x.id}">${esc(x.title)}</option>`).join('')+U().projects.map(p=>`<option value="p:${p.id}">Project: ${esc(p.name)}</option>`).join('');
  return `<div class="card tm"><span class="mu">Focus timer</span><div class="row"><b>00:00:00</b></div><select id="tsel" aria-label="Track time against">${o}</select><button class="btn w" onclick="tStart()">▶ Start tracking</button></div>`}
 const x=t.tid&&U().tasks.find(a=>a.id===t.tid),p=proj(t.pid);
 return `<div class="card tm"><span class="mu">${t.start?'Tracking now':'Paused'} · ${esc(x?x.title:p?p.name:'')}</span><div class="row"><b id="tm">${fmt(el()/1000|0)}</b></div><div class="row" style="margin-top:10px"><button class="btn sp" onclick="tToggle()">${t.start?'❚❚ Pause':'▶ Resume'}</button><button class="btn o sp" onclick="tStop()">■ Stop &amp; save</button></div></div>`}
setInterval(()=>{const e=$('#tm');if(e&&U()&&U().timer)e.textContent=fmt(el()/1000|0)},1000);
function tStart(){const v=$('#tsel').value;if(!v)return toast('Add a task or project first');const[k,id]=v.split(':'),u=U();
 let tid=null,pid=id;if(k==='t'){const t=u.tasks.find(x=>x.id===id);tid=id;pid=t.pid;if(t.st==='todo')t.st='doing'}
 u.timer={tid,pid,acc:0,start:Date.now()};save();render()}
function tToggle(){const t=U().timer;if(t.start){t.acc+=Date.now()-t.start;t.start=null}else t.start=Date.now();save();render()}
function tStop(){const u=U(),s=Math.round(el()/1000);if(s>=1)u.logs.push({id:uid(),tid:u.timer.tid,pid:u.timer.pid,sec:s,date:td(0)});u.timer=null;save();render();toast('Logged '+fmt(s))}
function tc(t){const p=proj(t.pid),L={done:'Completed',doing:'In Progress',todo:'To do'},ov=t.st!=='done'&&t.due<td(0);
 return `<div class="card task ${t.st==='done'?'done':''}" onclick="tsheet('${t.id}')"><button class="ck" aria-label="Complete task" onclick="event.stopPropagation();tog('${t.id}',this)">${t.st==='done'?ic('ck'):''}</button>
 <div class="sp"><div class="tt">${esc(t.title)}</div><div class="mu">${p?esc(p.name):'No project'} · <span style="${ov?'color:var(--r);font-weight:600':''}">${fdate(t.due)}</span>${t.est?` · ${t.est}h est`:''}</div>
 <div class="row" style="margin-top:6px"><span class="bd b-${t.pri}">${t.pri}</span><span class="bd b-${t.st}">${L[t.st]}</span></div></div>
 <button class="mu" aria-label="Delete task" style="border:0;background:none;font-size:20px" onclick="event.stopPropagation();del('${t.id}')">×</button></div>`}
function tog(id,b){const t=U().tasks.find(x=>x.id===id),d=t.st!=='done';b.closest('.task').classList.toggle('done',d);t.st=d?'done':'todo';if(d&&U().timer&&U().timer.tid===id)tStop();save();setTimeout(render,320)}
function del(id){if(!confirm('Delete this task?'))return;const u=U();u.tasks=u.tasks.filter(t=>t.id!==id);u.logs.forEach(l=>{if(l.tid===id)l.tid=null});if(u.timer&&u.timer.tid===id)u.timer=null;save();cl();render();toast('Task deleted')}
function tasks(){return `<input class="in" placeholder="Search tasks" value="${esc(V.q)}" oninput="V.q=this.value;lst()"><div class="pills">${['All','Today','High Priority','Completed'].map(f=>`<button class="pill ${V.f===f?'on':''}" onclick="V.f='${f}';render()">${f}</button>`).join('')}</div><div id="lst" style="display:flex;flex-direction:column;gap:10px"></div>`}
function lst(){const q=V.q.toLowerCase(),l=U().tasks.filter(t=>t.title.toLowerCase().includes(q)&&(V.f==='All'||(V.f==='Today'&&t.due<=td(0)&&t.st!=='done')||(V.f==='High Priority'&&t.pri==='High'&&t.st!=='done')||(V.f==='Completed'&&t.st==='done'))).sort((a,b)=>(a.st==='done')-(b.st==='done')||a.due.localeCompare(b.due));
 $('#lst').innerHTML=l.length?l.map(tc).join(''):'<div class="empty">No tasks here. Tap + to add one.</div>'}
const _r=render;render=function(){_r();if(DB.session&&U()&&U().setup&&V.tab==='tasks')lst()};
/* sheets */
function sh(t,b){$('#sh').innerHTML=`<div class="ov" onclick="if(event.target===this)cl()"><div class="sheet"><div class="grab"></div><h2>${t}</h2>${b}</div></div>`}
const cl=()=>$('#sh').innerHTML='';
function tsheet(id){const u=U(),t=id?u.tasks.find(x=>x.id===id):{title:'',pid:u.projects[0]&&u.projects[0].id,due:td(0),pri:'Medium',est:1};
 const lg=id?u.logs.filter(l=>l.tid===id).reduce((a,l)=>a+l.sec,0):0;
 sh(id?'Edit task':'New task',`<label>Title</label><input class="in" id="f1" value="${esc(t.title)}" placeholder="What needs doing?"><label>Client / project</label><select class="in" id="f2">${u.projects.map(p=>`<option value="${p.id}" ${p.id===t.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
 <div class="row"><div class="sp"><label>Due date</label><input class="in" id="f3" type="date" value="${t.due}"></div><div class="sp"><label>Est. hours</label><input class="in" id="f5" type="number" step=".25" min="0" value="${t.est}"></div></div>
 <label>Priority</label><select class="in" id="f4">${['Low','Medium','High'].map(p=>`<option ${p===t.pri?'selected':''}>${p}</option>`).join('')}</select><div class="err" id="fe"></div>
 ${id?`<label>Time logged: ${fmt(lg)}</label><div class="row">${[15,30,60].map(m=>`<button class="btn o s sp" onclick="logm('${id}',${m})">+${m} min</button>`).join('')}</div>`:''}
 <div class="row" style="margin-top:18px">${id?`<button class="btn d" onclick="del('${id}')">Delete</button>`:''}<button class="btn sp" onclick="saveT('${id||''}')">${id?'Save changes':'Add task'}</button></div>`)}
function saveT(id){const u=U(),title=$('#f1').value.trim();if(!title){$('#fe').textContent='Give the task a title.';return}
 const d={title,pid:$('#f2').value,due:$('#f3').value||td(0),pri:$('#f4').value,est:parseFloat($('#f5').value)||0};
 if(id)Object.assign(u.tasks.find(t=>t.id===id),d);else u.tasks.unshift({id:uid(),st:'todo',...d});save();cl();render();toast(id?'Task saved':'Task added')}
function logm(id,m){const u=U(),t=u.tasks.find(x=>x.id===id);u.logs.push({id:uid(),tid:id,pid:t.pid,sec:m*60,date:td(0)});save();tsheet(id);toast('Logged '+m+' min')}
/* projects */
function proj_(){}
function projF(){const u=U();return (u.projects.length?u.projects.map(p=>{const ts=u.tasks.filter(t=>t.pid===p.id),dn=ts.filter(t=>t.st==='done').length,pc=ts.length?Math.round(dn/ts.length*100):0,h=hrs(p.id);
