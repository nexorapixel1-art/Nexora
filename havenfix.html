<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HavenFix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--s:#F8FAFC;--t:#0F172A;--m:#64748B;--b:#E2E8F0;--g:#10B981;--gd:#059669;--a:#F59E0B;--r:#EF4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--s:#111A2E;--t:#F1F5F9;--m:#94A3B8;--b:#1E293B}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--b)}
nav .w{display:flex;align-items:center;gap:12px;height:62px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;cursor:pointer}.logo i{color:var(--g);font-style:normal}
.sp{flex:1}
.pill{display:flex;background:var(--s);border:1px solid var(--b);border-radius:99px;padding:3px}
.pill button{border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13px;color:var(--m);transition:.2s}
.pill button.on{background:var(--t);color:var(--bg)}
.lnk{background:none;border:0;cursor:pointer;font-weight:600;color:var(--m)}.lnk.on{color:var(--t)}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--gd)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.o{background:none;color:var(--t);border:1px solid var(--b)}.btn.o:hover{background:var(--s)}
.btn.d{background:none;color:var(--r);border:1px solid var(--b)}.btn.sm{padding:6px 11px;font-size:13px}
.hero{background:var(--s);border-bottom:1px solid var(--b);padding:56px 0 40px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:0 0 12px;max-width:680px}
.sub{color:var(--m);font-size:17px;max-width:520px;margin:0 0 24px}
.sb{display:flex;gap:8px;background:var(--bg);border:1px solid var(--b);border-radius:14px;padding:8px;max-width:680px;flex-wrap:wrap}
.sb input{flex:1 1 160px;border:0;background:none;padding:8px 10px;outline:0;min-width:0}
.trust{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;color:var(--m);font-weight:600;font-size:14px}.trust b{color:var(--g)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:24px 0 8px}
.tab{white-space:nowrap;border:1px solid var(--b);background:var(--bg);border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--m)}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:12px 0 56px}
.card{border:1px solid var(--b);border-radius:14px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--s);border:1px solid var(--b);color:var(--m)}
.star{color:var(--a);font-weight:700}.price{font-size:22px;font-weight:800}.price small{font-size:13px;color:var(--m);font-weight:500}
.card ul{margin:0;padding:0;list-style:none;color:var(--m);font-size:13.5px;flex:1}.card li:before{content:"✓ ";color:var(--g);font-weight:800}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.mod{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px;border:1px solid var(--b)}
@media(min-width:640px){.ov{align-items:center}.mod{border-radius:18px}}
.mod h2{margin:0 0 4px;font-size:20px}.bar{height:6px;background:var(--b);border-radius:9px;margin:12px 0 18px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap}.opt{border:1px solid var(--b);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;margin:6px 0;width:100%;background:none;text-align:left}
.opt.on{border-color:var(--g);background:rgba(16,185,129,.08)}
.chip{border:1px solid var(--b);background:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}.chip.on{border-color:var(--g);background:rgba(16,185,129,.1);color:var(--gd)}.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--b);border-radius:10px;padding:9px 11px;background:var(--bg)}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-weight:800;font-size:18px;border-top:1px solid var(--b);margin-top:6px;padding-top:10px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.st{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.s-Pending{background:var(--a)}.s-Confirmed{background:#3B82F6}.s-Technician{background:#8B5CF6}.s-In{background:#0EA5E9}.s-Completed{background:var(--g)}.s-Cancelled{background:#94A3B8}
.bk{border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
.bk .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.steps{display:flex;gap:4px;margin:14px 0}.steps i{flex:1;height:5px;border-radius:9px;background:var(--b)}.steps i.on{background:var(--g)}
.tech{display:flex;gap:12px;align-items:center;background:var(--s);border-radius:12px;padding:10px 12px;margin:8px 0;flex-wrap:wrap}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:24px 0}
.kpi{border:1px solid var(--b);border-radius:14px;padding:16px;background:var(--s)}.kpi b{display:block;font-size:26px;letter-spacing:-.5px}.kpi span{color:var(--m);font-size:13px;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:820px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--b);font-size:14px;vertical-align:middle}th{background:var(--s);color:var(--m);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:50;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.msg{background:var(--s);border-radius:12px;padding:8px 12px;margin:6px 0;max-width:85%}.msg.me{background:var(--g);color:#fff;margin-left:auto}
.empty{text-align:center;color:var(--m);padding:40px 0}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="tt"></div>
<script>
const $=id=>document.getElementById(id);
const TECH=[{id:1,n:'Marcus Vance',r:'Master Plumber',c:'#0EA5E9',rt:4.9,lic:'Lic. PL-20418'},{id:2,n:'Elena Rostova',r:'Lead Electrician',c:'#8B5CF6',rt:4.9,lic:'Lic. EL-77310'},{id:3,n:'Priya Nair',r:'Deep Clean Lead',c:'#EC4899',rt:4.8,lic:'Bonded & Insured'},{id:4,n:'Diego Alvarez',r:'HVAC Specialist',c:'#F97316',rt:4.7,lic:'EPA 608 Certified'},{id:5,n:'Sam Okafor',r:'Master Handyman',c:'#14B8A6',rt:4.8,lic:'Lic. HM-5521'}];
const CATS=['Plumbing','Electrical','Deep Cleaning','AC & Appliance Repair','Handyman'];
const SVC0=[
{id:1,n:'Leak & Pipe Repair',c:'Plumbing',p:89,u:'flat',d:'1–2 hrs',rt:4.9,rv:124,inc:['Leak diagnosis','Parts up to $20','30-day warranty'],on:1},
{id:2,n:'Drain Unclogging',c:'Plumbing',p:75,u:'flat',d:'1 hr',rt:4.8,rv:96,inc:['Camera inspection','Hydro-jet clearing','Cleanup'],on:1},
{id:3,n:'Wiring & Fixture Install',c:'Electrical',p:65,u:'hr',d:'2–3 hrs',rt:4.9,rv:88,inc:['Safety check','Fixture mounting','Licensed electrician'],on:1},
{id:4,n:'Panel & Outlet Upgrade',c:'Electrical',p:129,u:'flat',d:'3 hrs',rt:4.8,rv:61,inc:['GFCI outlets','Load test','Permit guidance'],on:1},
{id:5,n:'Whole-Home Deep Clean',c:'Deep Cleaning',p:149,u:'flat',d:'4–5 hrs',rt:4.9,rv:212,inc:['Kitchen & bath scrub','Inside appliances','Vacuum & mop'],on:1},
{id:6,n:'AC Service & Gas Refill',c:'AC & Appliance Repair',p:99,u:'flat',d:'1.5 hrs',rt:4.7,rv:140,inc:['Filter & coil clean','Gas pressure check','Cooling test'],on:1},
{id:7,n:'Washer & Fridge Repair',c:'AC & Appliance Repair',p:70,u:'hr',d:'1–2 hrs',rt:4.8,rv:77,inc:['Diagnosis','Genuine parts quote','90-day warranty'],on:1},
{id:8,n:'Furniture & Shelf Assembly',c:'Handyman',p:55,u:'hr',d:'2 hrs',rt:4.9,rv:158,inc:['Tools provided','Wall mounting','Debris removal'],on:1}];
const dISO=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const SLOTS=['09:00 AM – 11:00 AM','11:00 AM – 01:00 PM','01:00 PM – 03:00 PM','03:00 PM – 05:00 PM','05:00 PM – 07:00 PM'];
const SEED=[
{id:'HF-7201',sv:1,name:'Aisha Khan',phone:'555-0142',addr:'42 Maple Street, Apt 3B',notes:'Kitchen sink leaking under cabinet.',date:dISO(2),slot:SLOTS[1],size:1,add:{},total:96.12,st:'Confirmed',tech:null,paid:0},
{id:'HF-7188',sv:3,name:'Aisha Khan',phone:'555-0142',addr:'42 Maple Street, Apt 3B',notes:'Install 3 pendant lights.',date:dISO(0),slot:SLOTS[0],size:1,add:{},total:210.6,st:'In Progress',tech:2,paid:0},
{id:'HF-7090',sv:5,name:'Aisha Khan',phone:'555-0142',addr:'42 Maple Street, Apt 3B',notes:'',date:dISO(-6),slot:SLOTS[2],size:1.4,add:{eco:1},total:238.9,st:'Completed',tech:3,paid:1,review:{r:5,tip:10,t:'Spotless, thank you!'}},
{id:'HF-7123',sv:6,name:'Rahul Mehta',phone:'555-0177',addr:'9 Harbor View Rd',notes:'Gate code #4321',date:dISO(1),slot:SLOTS[3],size:1,add:{},total:106.92,st:'Pending',tech:null,paid:0},
{id:'HF-7102',sv:8,name:'Linda Cho',phone:'555-0119',addr:'118 Oak Lane',notes:'',date:dISO(-3),slot:SLOTS[0],size:1,add:{},total:118.8,st:'Completed',tech:5,paid:1,review:{r:5,tip:0,t:''}}];
let S={sv:SVC0,bk:SEED,cat:'All',q:'',view:'home',role:'c',f:'All',n:8492,chat:{}};
try{const x=JSON.parse(localStorage.getItem('hf3')||'null');if(x)S=x}catch(e){}
S.cat='All';S.q='';
const save=()=>{try{localStorage.setItem('hf3',JSON.stringify(S))}catch(e){}};
const $$=n=>'$'+n.toFixed(2);const sv=id=>S.sv.find(x=>x.id===id);const tc=id=>TECH.find(x=>x.id===id);
const fd=i=>new Date(i+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const stc=s=>'s-'+s.split(' ')[0];
const ST=['Pending','Confirmed','Technician Assigned','In Progress','Completed'];
function toast(t){$('tt').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('tt').innerHTML='',2400)}
function render(){
 const a=S.role==='a';
 $('app').innerHTML=`<nav><div class="w"><div class="logo" onclick="go('home')">Haven<i>Fix</i></div><div class="sp"></div>
 ${a?'':`<button class="lnk ${S.view==='home'?'on':''}" onclick="go('home')">Services</button><button class="lnk ${S.view==='dash'?'on':''}" onclick="go('dash')">My Bookings</button>`}
 <div class="pill"><button class="${a?'':'on'}" onclick="role('c')">Customer View</button><button class="${a?'on':''}" onclick="role('a')">Admin Operations View</button></div></div></nav>`+(a?admin():S.view==='home'?home():dash());
 if(!a&&S.view==='home')grid()}
function go(v){S.view=v;render();scrollTo(0,0)}
function role(r){S.role=r;S.view=r==='c'&&S.view==='dash'?'dash':'home';render()}
function home(){return `<div class="hero"><div class="w"><h1>Trusted Home Pros, Booked in Minutes</h1><p class="sub">Vetted plumbers, electricians, cleaners and fixers at upfront prices — arriving in a 2-hour window you choose.</p>
<div class="sb"><input id="q" placeholder="What do you need? e.g. leaking tap" oninput="S.q=this.value;grid()"><input placeholder="PIN code" maxlength="6" style="flex:0 1 110px"><button class="btn" onclick="$('gr').scrollIntoView({behavior:'smooth'})">Find pros</button></div>
<div class="trust"><span><b>✓</b> Background-checked pros</span><span><b>✓</b> Upfront pricing</span><span><b>✓</b> 100% satisfaction guarantee</span></div></div></div>
<div class="w" id="gr"><div class="tabs">${['All',...CATS].map(c=>`<button class="tab ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c==='All'?'All Services':c}</button>`).join('')}</div><div class="grid" id="grid"></div></div>`}
function grid(){const q=S.q.toLowerCase();const l=S.sv.filter(s=>s.on&&(S.cat==='All'||s.c===S.cat)&&(s.n+s.c).toLowerCase().includes(q));
 $('grid').innerHTML=l.length?l.map(s=>`<div class="card"><div><span class="badge">${s.c}</span></div><h3>${s.n}</h3><div><span class="star">${s.rt} ★</span> <span style="color:var(--m)">(${s.rv} reviews) · ✓ Verified pro</span></div>
 <div class="price">$${s.p}<small> ${s.u==='hr'?'/hr':'flat rate'} · ${s.d}</small></div><ul>${s.inc.map(i=>`<li>${i}</li>`).join('')}</ul><button class="btn" onclick="book(${s.id})">Book Now</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1">No services match. Try another category or search.</div>'}
/* booking */
let B=null;const SZ=[['Studio / 1 unit',1],['2 units / 2BHK',1.4],['3+ units / 3BHK',1.8]];
const ADD={eco:['Eco-friendly supplies',15],em:['Emergency same-day priority',25]};
function book(id){B={id,step:1,size:1,add:{},date:dISO(1),slot:null,addr:'',name:'',phone:'',notes:''};mm()}
function calc(){const s=sv(B.id);const base=s.p*B.size;const ad=Object.keys(B.add).filter(k=>B.add[k]).reduce((a,k)=>a+ADD[k][1],0);const sub=base+ad;return{base,ad,tax:sub*.08,total:sub*1.08}}
const avail=(o,i,id)=>(o+i*2+id)%4!==0&&!(o===0&&i<2);
function mm(){if(!B){$('m').innerHTML='';return}
 const s=sv(B.id),c=calc();let h='';
 if(B.step===1)h=`<label>Home size / units</label>`+SZ.map(z=>`<button class="opt ${B.size===z[1]?'on':''}" onclick="B.size=${z[1]};mm()"><span>${z[0]}</span><b>${$$(s.p*z[1])}</b></button>`).join('')+`<label>Optional extras</label>`+Object.keys(ADD).map(k=>`<button class="opt ${B.add[k]?'on':''}" onclick="B.add.${k}=!B.add.${k};mm()"><span>${B.add[k]?'☑':'☐'} ${ADD[k][0]}</span><b>+$${ADD[k][1]}</b></button>`).join('');
 if(B.step===2)h=`<label>Pick a date</label><div class="row">${[1,2,3,4,5,6,7,0].map(o=>`<button class="chip ${B.date===dISO(o)?'on':''}" onclick="B.date='${dISO(o)}';B.slot=null;mm()">${o===0?'Today':fd(dISO(o))}</button>`).join('')}</div><label>Arrival window (2 hrs)</label><div class="row">${SLOTS.map((t,i)=>{const o=Math.round((new Date(B.date)-new Date(dISO(0)))/864e5);return `<button class="chip ${B.slot===t?'on':''}" ${avail(o,i,B.id)?'':'disabled'} onclick="B.slot='${t}';mm()">${t}</button>`}).join('')}</div>`;
 if(B.step===3)h=`<label>Full name</label><input class="f" value="${B.name}" oninput="B.name=this.value"><label>Phone</label><input class="f" value="${B.phone}" oninput="B.phone=this.value"><label>Street address</label><input class="f" value="${B.addr}" oninput="B.addr=this.value"><label>Special instructions</label><textarea class="f" rows="3" placeholder="Gate code is #4321, park in driveway" oninput="B.notes=this.value">${B.notes}</textarea>`;
 if(B.step===4)h=`<p><b>${s.n}</b><br><span style="color:var(--m)">${fd(B.date)} · ${B.slot}<br>${B.addr}</span></p><div class="tot"><span>Base (${SZ.find(z=>z[1]===B.size)[0]})</span><span>${$$(c.base)}</span></div>${Object.keys(B.add).filter(k=>B.add[k]).map(k=>`<div class="tot"><span>${ADD[k][0]}</span><span>$${ADD[k][1]}.00</span></div>`).join('')}<div class="tot"><span>Tax (8%)</span><span>${$$(c.tax)}</span></div><div class="tot big"><span>Total</span><span>${$$(c.total)}</span></div><p style="color:var(--m);font-size:13px">You pay after the job is complete. Free cancellation up to 24 hrs before.</p>`;
 const ok=B.step===2?B.slot:B.step===3?(B.name&&B.phone&&B.addr):1;
 $('m').innerHTML=`<div class="ov" onclick="if(event.target===this){B=null;mm()}"><div class="mod"><h2>${s.n}</h2><div style="color:var(--m);font-size:13px">Step ${B.step} of 4 · Total ${$$(c.total)}</div><div class="bar"><i style="width:${B.step*25}%"></i></div>${h}
 <div class="foot"><button class="btn o" onclick="${B.step===1?'B=null':'B.step--'};mm()">${B.step===1?'Close':'Back'}</button><button class="btn" ${ok?'':'disabled'} onclick="${B.step===4?'confirmB()':'B.step++;mm()'}">${B.step===4?'Confirm Booking':'Continue'}</button></div></div></div>`}
function confirmB(){const c=calc();const id='HF-'+(++S.n);S.bk.unshift({id,sv:B.id,name:B.name,phone:B.phone,addr:B.addr,notes:B.notes,date:B.date,slot:B.slot,size:B.size,add:{...B.add},total:c.total,st:'Pending',tech:null,paid:0});save();B=null;mm();S.view='dash';render();scrollTo(0,0);toast('Booking #'+id+' confirmed!')}
/* dashboard */
function dash(){const l=S.bk.filter(b=>b.name==='Aisha Khan'||b.id===S.bk[0].id&&S.n>8492);const mine=S.bk.filter(b=>b.phone==='555-0142'||b.id.replace('HF-','')>8492);
 return `<div class="w" style="padding-top:28px;padding-bottom:56px"><h1 style="font-size:30px">My Bookings</h1>${mine.length?mine.map(bkc).join(''):'<div class="empty">No bookings yet. Browse services to get started.</div>'}</div>`}
function bkc(b){const s=sv(b.sv),t=tc(b.tech),i=ST.indexOf(b.st),x=b.st==='Cancelled';
 return `<div class="bk"><div class="h"><div><b style="font-size:17px">${s.n}</b><div style="color:var(--m);font-size:13.5px">#${b.id} · ${fd(b.date)} · ${b.slot}<br>${b.addr}</div></div><div style="text-align:right"><span class="st ${stc(b.st)}">${b.st}</span><div style="font-weight:800;margin-top:4px">${$$(b.total)}</div></div></div>
 ${x?'':`<div class="steps">${ST.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div>`}
 ${t?`<div class="tech"><div class="av" style="background:${t.c}">${t.n.split(' ').map(w=>w[0]).join('')}</div><div style="flex:1"><b>${t.n}</b> <span class="star">${t.rt} ★</span><div style="font-size:13px;color:var(--m)">${t.r} · <span style="color:var(--gd);font-weight:700">✓ ${t.lic}</span></div></div><button class="btn o sm" onclick="chat('${b.id}')">Message Pro</button></div>`:x?'':'<div style="color:var(--m);font-size:13px;margin:8px 0">A pro will be assigned shortly.</div>'}
 ${b.review?`<div style="font-size:13.5px"><span class="star">${'★'.repeat(b.review.r)}</span> ${b.review.t||''} ${b.review.tip?`· Tip $${b.review.tip}`:''}</div>`:''}
 <div class="row" style="margin-top:8px">${['Pending','Confirmed','Technician Assigned'].includes(b.st)?`<button class="btn o sm" onclick="resched('${b.id}')">Reschedule</button><button class="btn d sm" onclick="cancel('${b.id}')">Cancel Booking</button>`:''}${b.st==='Completed'&&!b.review?`<button class="btn sm" onclick="review('${b.id}')">Leave a Review &amp; Tip</button>`:''}</div></div>`}
function cancel(id){if(confirm('Cancel booking #'+id+'? This cannot be undone.')){S.bk.find(b=>b.id===id).st='Cancelled';save();render();toast('Booking cancelled')}}
let R=null;
function resched(id){const b=S.bk.find(x=>x.id===id);R={id,date:b.date,slot:b.slot,sv:b.sv};rm()}
function rm(){if(!R){$('m').innerHTML='';return}
 $('m').innerHTML=`<div class="ov"><div class="mod"><h2>Reschedule</h2><label>Date</label><div class="row">${[1,2,3,4,5,6,7].map(o=>`<button class="chip ${R.date===dISO(o)?'on':''}" onclick="R.date='${dISO(o)}';rm()">${fd(dISO(o))}</button>`).join('')}</div><label>Window</label><div class="row">${SLOTS.map((t,i)=>{const o=Math.round((new Date(R.date)-new Date(dISO(0)))/864e5);return `<button class="chip ${R.slot===t?'on':''}" ${avail(o,i,R.sv)?'':'disabled'} onclick="R.slot='${t}';rm()">${t}</button>`}).join('')}</div>
 <div class="foot"><button class="btn o" onclick="R=null;rm()">Close</button><button class="btn" onclick="const b=S.bk.find(x=>x.id===R.id);b.date=R.date;b.slot=R.slot;save();R=null;rm();render();toast('Rescheduled')">Save new time</button></div></div></div>`}
let V=null;
function review(id){V={id,r:5,tip:5,t:''};vm()}
function vm(){if(!V){$('m').innerHTML='';return}
 $('m').innerHTML=`<div class="ov"><div class="mod"><h2>How did it go?</h2><div class="row" style="margin:12px 0">${[1,2,3,4,5].map(n=>`<button class="chip star ${V.r>=n?'on':''}" onclick="V.r=${n};vm()">★</button>`).join('')}</div><label>Tip your pro</label><div class="row">${[0,5,10,15].map(n=>`<button class="chip ${V.tip===n?'on':''}" onclick="V.tip=${n};vm()">${n?'$'+n:'No tip'}</button>`).join('')}</div><label>Comments</label><textarea class="f" rows="3" oninput="V.t=this.value"></textarea>
 <div class="foot"><button class="btn o" onclick="V=null;vm()">Close</button><button class="btn" onclick="const b=S.bk.find(x=>x.id===V.id);b.review={r:V.r,tip:V.tip,t:V.t};save();V=null;vm();render();toast('Thanks for your review!')">Submit review</button></div></div></div>`}
function chat(id){const b=S.bk.find(x=>x.id===id),t=tc(b.tech);S.chat[id]=S.chat[id]||[['p','Hi! I\'m '+t.n.split(' ')[0]+', your assigned pro. Anything I should know before I arrive?']];cm(id)}
function cm(id){const b=S.bk.find(x=>x.id===id),t=tc(b.tech);
 $('m').innerHTML=`<div class="ov"><div class="mod"><h2>${t.n}</h2><div style="color:var(--m);font-size:13px">${t.r}</div><div style="margin:12px 0">${S.chat[id].map(m=>`<div class="msg ${m[0]==='u'?'me':''}">${m[1]}</div>`).join('')}</div><div class="row" style="flex-wrap:nowrap"><input class="f" id="ci" placeholder="Type a message" onkeydown="if(event.key==='Enter')send('${id}')"><button class="btn" onclick="send('${id}')">Send</button></div><div class="foot"><button class="btn o" onclick="$('m').innerHTML=''">Close</button></div></div></div>`;$('ci').focus()}
function send(id){const v=$('ci').value.trim();if(!v)return;S.chat[id].push(['u',v]);cm(id);setTimeout(()=>{S.chat[id].push(['p','Got it — thanks! See you in your arrival window.']);if($('ci'))cm(id)},900);save()}
/* admin */
function admin(){const done=S.bk.filter(b=>b.st==='Completed');const rev=done.reduce((a,b)=>a+b.total+(b.review?b.review.tip:0),0);
 const act=S.bk.filter(b=>b.date===dISO(0)&&!['Cancelled','Completed'].includes(b.st)).length;
 const pend=S.bk.filter(b=>['Pending','Confirmed'].includes(b.st)).length;
 const rs=S.bk.filter(b=>b.review).map(b=>b.review.r);const cs=rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(2):'—';
 const fl=S.bk.filter(b=>S.f==='All'||(S.f==='Pending'&&['Pending','Confirmed'].includes(b.st))||(S.f==='Assigned'&&['Technician Assigned','In Progress'].includes(b.st))||(S.f===b.st));
 return `<div class="w" style="padding-top:24px;padding-bottom:56px"><div class="h" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h1 style="font-size:28px;margin:0">Operations</h1><button class="btn" onclick="cat()">Service Catalog Manager</button></div>
 <div class="kpis"><div class="kpi"><span>Total revenue captured</span><b>${$$(rev)}</b></div><div class="kpi"><span>Active jobs today</span><b>${act}</b></div><div class="kpi"><span>Pending assignments</span><b style="color:var(--a)">${pend}</b></div><div class="kpi"><span>Customer satisfaction</span><b><span class="star">★</span> ${cs}</b></div></div>
 <div class="tabs" style="padding-top:0">${['All','Pending','Assigned','Completed'].map(f=>`<button class="tab ${S.f===f?'on':''}" onclick="S.f='${f}';render()">${f}</button>`).join('')}</div>
 <div class="tw"><table><tr><th>Booking</th><th>Customer</th><th>Service</th><th>When</th><th>Total</th><th>Status</th><th>Pro</th><th>Action</th></tr>
 ${fl.map(b=>{const t=tc(b.tech);let a='';
 if(['Pending','Confirmed'].includes(b.st))a=(b.st==='Pending'?`<button class="btn sm" onclick="adv('${b.id}','Confirmed')">Confirm</button> `:'')+`<select class="f" style="width:auto;padding:5px" onchange="assign('${b.id}',this.value)"><option value="">Assign pro…</option>${TECH.map(t=>`<option value="${t.id}">${t.n} – ${t.r}</option>`).join('')}</select>`;
 if(b.st==='Technician Assigned')a=`<button class="btn sm" onclick="adv('${b.id}','In Progress')">Mark In-Progress</button>`;
 if(b.st==='In Progress')a=`<button class="btn sm" onclick="adv('${b.id}','Completed')">Complete &amp; Capture Payment</button>`;
 return `<tr><td><b>#${b.id}</b></td><td>${b.name}<div style="color:var(--m);font-size:12px">${b.phone}</div></td><td>${sv(b.sv).n}</td><td>${fd(b.date)}<div style="color:var(--m);font-size:12px">${b.slot}</div></td><td>${$$(b.total)}</td><td><span class="st ${stc(b.st)}">${b.st}</span></td><td>${t?t.n:'—'}</td><td>${a||(b.paid?'Paid ✓':'')}</td></tr>`}).join('')}</table></div></div>`}
function adv(id,st){const b=S.bk.find(x=>x.id===id);b.st=st;if(st==='Completed')b.paid=1;save();render();toast(st==='Completed'?'Payment captured: '+$$(b.total):'Status: '+st)}
function assign(id,t){if(!t)return;const b=S.bk.find(x=>x.id===id);b.tech=+t;b.st='Technician Assigned';save();render();toast(tc(+t).n+' assigned to #'+id)}
function cat(){$('m').innerHTML=`<div class="ov" onclick="if(event.target===this)$('m').innerHTML=''"><div class="mod"><h2>Service Catalog</h2><div style="color:var(--m);font-size:13px">Changes appear on the storefront instantly.</div>
 ${S.sv.map(s=>`<div class="row" style="align-items:center;margin:8px 0;flex-wrap:nowrap"><div style="flex:1;min-width:0"><b>${s.n}</b><div style="font-size:12px;color:var(--m)">${s.c}</div></div><input class="f" type="number" min="1" style="width:74px" value="${s.p}" onchange="sv(${s.id}).p=Math.max(1,+this.value);save();toast('Price updated')"><button class="chip ${s.on?'on':''}" onclick="sv(${s.id}).on=${s.on?0:1};save();cat()">${s.on?'Live':'Hidden'}</button></div>`).join('')}
 <label>Add a new service</label><input class="f" id="nn" placeholder="Service name"><div class="row" style="margin-top:6px;flex-wrap:nowrap"><select class="f" id="nc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input class="f" id="np" type="number" placeholder="Price" style="width:90px"></div>
 <div class="foot"><button class="btn o" onclick="$('m').innerHTML='';render()">Done</button><button class="btn" onclick="addS()">Add service</button></div></div></div>`}
function addS(){const n=$('nn').value.trim(),p=+$('np').value;if(!n||!p){toast('Enter a name and price');return}
 S.sv.push({id:Date.now(),n,c:$('nc').value,p,u:'flat',d:'1–2 hrs',rt:5,rv:0,inc:['Vetted pro','Upfront pricing','Satisfaction guarantee'],on:1});save();cat();toast('Service added')}
render();
</script></body></html>
