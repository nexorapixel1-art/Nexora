<div className="card overflow-x-auto"><table className="w-full"><thead><tr><th>Date</th><th>Description</th><th>Status</th><th style=${{textAlign:'right'}}>Amount</th><th></th></tr></thead><tbody><${Rows} list=${ftx} edit=${true}/>${!ftx.length&&h`<tr><td colSpan="5" className="text-center text-slate-500 py-8">No transactions match.</td></tr>`}</tbody></table></div><div className="text-xs text-slate-500">${ftx.length} shown · Income ${$.format(sum(ftx.filter(t=>t.type==='income')))} · Expenses ${$.format(sum(ftx.filter(t=>t.type==='expense')))}</div>`}
${view==='Customers'&&h`<div className="flex">${sel(cf,setCf,['All',...CS])}<button className="btn p ml-auto" onClick=${()=>setModal({cu:null})}><${Ic} n="plus" s=${14}/>Add customer</button></div><div className="card overflow-x-auto"><table className="w-full"><thead><tr><th>Customer</th><th>Email</th><th>Status</th><th style=${{textAlign:'right'}}>Total Spend</th><th>Last Activity</th><th></th></tr></thead><tbody>${fcu.map(c=>h`<tr key=${c.id} className="hover:bg-slate-50 cursor-pointer" onClick=${()=>setDrawer(c.id)}><td><div className="font-medium">${c.name}</div><div className="text-xs text-slate-500">${c.company}</div></td><td>${c.email}</td><td><${Badge} t=${c.status}/></td><td className="text-right font-medium text-emerald-600">${$.format(spend(c))}</td><td className="text-slate-500">${lastAct(c)}</td><td className="whitespace-nowrap" onClick=${e=>e.stopPropagation()}><button className="p-1 text-slate-500" onClick=${()=>setModal({cu:c})}><${Ic} n="edit" s=${14}/></button><button className="p-1 text-rose-500" onClick=${()=>delCu(c)}><${Ic} n="trash" s=${14}/></button></td></tr>`)}</tbody></table></div>`}
${view.startsWith('Reports')&&h`<div className="card p-5"><div className="flex justify-between items-start mb-3"><div><b className="text-base">Profit & Loss Statement</b><div className="text-xs text-slate-500">Nexora Ops · ${range} · generated ${new Date().toLocaleDateString()}</div></div></div><table className="w-full"><tbody>
<tr><td colSpan="2" className="font-semibold bg-slate-50">Gross Revenue</td></tr>${IN.map(c=>h`<tr key=${c}><td className="pl-6">${c}</td><td className="text-right">${$2.format(pl(c))}</td></tr>`)}<tr><td className="font-semibold">Total Revenue</td><td className="text-right font-semibold text-emerald-600">${$2.format(rev)}</td></tr>
<tr><td colSpan="2" className="font-semibold bg-slate-50">Operating Expenses</td></tr>${EX.map(c=>h`<tr key=${c}><td className="pl-6">${c}</td><td className="text-right">(${$2.format(pl(c))})</td></tr>`)}<tr><td className="font-semibold">Total Expenses</td><td className="text-right font-semibold text-rose-500">(${$2.format(ex)})</td></tr>
<tr><td className="font-semibold bg-slate-50">Net Operating Income</td><td className="text-right font-semibold bg-slate-50">${$2.format(net)}</td></tr><tr><td>Estimated Tax (21%)</td><td className="text-right">(${$2.format(tax)})</td></tr><tr><td className="font-semibold">Net Income After Tax</td><td className="text-right font-semibold">${$2.format(net-tax)}</td></tr></tbody></table></div>
<div className="card overflow-x-auto"><div className="p-4 pb-2 font-semibold">Monthly Summary</div><table className="w-full"><thead><tr><th>Month</th><th style=${{textAlign:'right'}}>Revenue</th><th style=${{textAlign:'right'}}>Expenses</th><th style=${{textAlign:'right'}}>Net</th><th style=${{textAlign:'right'}}>Margin</th></tr></thead><tbody>${months.map((m,i)=>h`<tr key=${m}><td>${mlab(m)}</td><td className="text-right text-emerald-600">${$.format(mon[i][0])}</td><td className="text-right text-rose-500">${$.format(mon[i][1])}</td><td className="text-right font-medium">${$.format(mon[i][0]-mon[i][1])}</td><td className="text-right">${mon[i][0]?((mon[i][0]-mon[i][1])/mon[i][0]*100).toFixed(1)+'%':'—'}</td></tr>`)}</tbody></table></div>
<div className="card p-5 noprint"><b>Exports & Backup</b><div className="flex flex-wrap gap-2 mt-3">
<button className="btn" onClick=${()=>save('transactions.csv','text/csv',csv([['Date','Description','Type','Category','Party','Status','Amount'],...ftx.map(t=>[t.date,t.title,t.type,t.category,t.party,t.status,t.amount.toFixed(2)])]),notify)}><${Ic} n="dl" s=${14}/>Transactions CSV (${ftx.length})</button>
<button className="btn" onClick=${()=>save('customers.csv','text/csv',csv([['Name','Company','Email','Status','Total Spend','Last Activity'],...cust.map(c=>[c.name,c.company,c.email,c.status,spend(c).toFixed(2),lastAct(c)])]),notify)}><${Ic} n="dl" s=${14}/>Customers CSV</button>
<button className="btn" onClick=${()=>save('nexora-backup.json','application/json',JSON.stringify(db,null,2),notify)}><${Ic} n="dl" s=${14}/>Full Backup (JSON)</button>
<button className="btn" onClick=${()=>fileRef.current.click()}><${Ic} n="up" s=${14}/>Import JSON Backup</button><input ref=${fileRef} type="file" accept=".json,application/json" className="hidden" onChange=${impJ}/>
<button className="btn p" onClick=${()=>window.print()}><${Ic} n="print" s=${14}/>Print / Save PDF</button></div><div className="text-xs text-slate-500 mt-2">The transactions CSV reflects filters set on the Transactions tab and the date range above.</div></div>`}
</main></div>
${modal&&modal.tx!==undefined&&h`<${TxForm} init=${modal.tx} cust=${cust} onSave=${saveTx} onClose=${()=>setModal(null)}/>`}
${modal&&modal.cu!==undefined&&h`<${CuForm} init=${modal.cu} onSave=${saveCu} onClose=${()=>setModal(null)}/>`}
${dc&&h`<div className="fixed inset-0 z-40 bg-slate-900/30 noprint" onClick=${()=>setDrawer(null)}><div className="absolute right-0 top-0 h-full w-full max-w-md bg-white p-5 overflow-auto shadow-xl" onClick=${e=>e.stopPropagation()}><div className="flex justify-between"><div><b className="text-lg">${dc.name}</b><div className="text-slate-500">${dc.company}</div></div><button onClick=${()=>setDrawer(null)}><${Ic} n="x"/></button></div><div className="mt-3 space-y-1"><div>${dc.email}</div><${Badge} t=${dc.status}/></div><div className="card p-4 my-4"><div className="text-xs text-slate-500">Lifetime value (paid)</div><div className="text-2xl font-semibold text-emerald-600">${$2.format(spend(dc))}</div></div><b>Transaction history</b><table className="w-full mt-2"><tbody><${Rows} list=${tx.filter(t=>t.party===dc.name).sort((a,b)=>b.date.localeCompare(a.date))}/></tbody></table><div className="flex gap-2 mt-4"><button className="btn" onClick=${()=>{setModal({cu:dc});setDrawer(null)}}>Edit</button><button className="btn text-rose-600" onClick=${()=>delCu(dc)}>Delete</button></div></div></div>`}
${toast&&h`<div className=${'noprint fixed bottom-5 right-5 z-50 px-4 py-2 rounded-lg text-white shadow-lg '+(toast.k==='err'?'bg-rose-500':'bg-slate-900')}>${toast.m}</div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
